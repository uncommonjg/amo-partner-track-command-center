<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC-PA Pipeline — AMO Clinical Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f8;
  --sidebar-bg:#fbfbfd;
  --sidebar-border:#e9e9ef;
  --card-bg:#fff;
  --card-border:#e6e6ee;
  --card-shadow:0 1px 3px rgba(20,22,40,.07);
  --indigo:#4b5ce4;
  --indigo-lt:#ebedfd;
  --indigo-dk:#3747c0;
  --dark:#2b2d45;
  --dark2:#1e2030;
  --muted:#8a8fa8;
  --muted2:#b0b5cc;
  --text:#1e2030;
  --text2:#42465a;
  --green:#27ae60;--green-lt:#e5f4ec;
  --amber:#e07b00;--amber-lt:#fef3e2;
  --red:#d63c2f;--red-lt:#ffebee;
  --blue:#2980b9;--blue-lt:#e3f2fd;
  --border-r:10px;
  --font:'Inter',system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5;display:flex;min-height:100vh}

/* SIDEBAR */
aside{
  width:248px;flex:none;display:flex;flex-direction:column;
  background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);
  padding:14px 10px;overflow-y:auto;position:sticky;top:0;height:100vh;
}
.aside-back{
  display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;
  color:var(--muted);font-size:12.5px;font-weight:500;text-decoration:none;
  transition:background .12s,color .12s;margin-bottom:6px;
}
.aside-back:hover{background:var(--bg);color:var(--text)}
.aside-back svg{opacity:.6}
.aside-divider{height:1px;background:var(--sidebar-border);margin:8px 2px}
.aside-label{font-size:10.5px;font-weight:600;color:var(--muted2);letter-spacing:.07em;text-transform:uppercase;padding:10px 10px 4px}
.hub-nav-item{
  display:flex;align-items:center;gap:0;padding:7px 10px;border-radius:9px;
  cursor:pointer;transition:background .12s;color:var(--text2);font-size:12.5px;
  font-weight:500;text-decoration:none;border:none;background:none;width:100%;text-align:left;
}
.hub-nav-item:hover{background:var(--bg)}
.hub-nav-item.active{background:var(--card-bg);border:1px solid var(--card-border);box-shadow:var(--card-shadow);color:var(--text)}
.hub-nav-dot{width:7px;height:7px;border-radius:50%;flex:none;margin-right:9px}
.hub-nav-count{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
.aside-stats{margin-top:auto;padding-top:12px;border-top:1px solid var(--sidebar-border)}
.aside-stat{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:12px}
.aside-stat-lbl{color:var(--muted);font-weight:400}
.aside-stat-val{font-weight:600;color:var(--text)}

/* MAIN */
main{flex:1;display:flex;flex-direction:column;min-width:0}

/* PAGE HEADER */
.page-header{
  background:linear-gradient(148deg,var(--dark2) 0%,var(--dark) 60%,#1a1d35 100%);
  padding:28px 32px 24px;border-bottom:1px solid rgba(255,255,255,.07);
}
.page-header h1{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.025em}
.page-header p{color:rgba(255,255,255,.5);font-size:12.5px;margin-top:4px}
.header-stats{display:flex;gap:24px;margin-top:20px}
.hstat{}
.hstat-val{font-size:22px;font-weight:700;color:#fff;line-height:1}
.hstat-lbl{font-size:11px;color:rgba(255,255,255,.45);margin-top:3px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}

/* FILTER BAR */
.filter-bar{
  background:var(--card-bg);border-bottom:1px solid var(--card-border);
  padding:10px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  position:sticky;top:0;z-index:10;
}
.filter-bar select,
.filter-bar input[type=text]{
  border:1px solid var(--card-border);border-radius:8px;padding:5px 10px;
  font-family:var(--font);font-size:12.5px;color:var(--text);background:var(--bg);
  outline:none;transition:border-color .15s;
}
.filter-bar select:focus,
.filter-bar input:focus{border-color:var(--indigo);box-shadow:0 0 0 2px rgba(75,92,228,.12)}
.filter-btn{
  padding:5px 12px;border-radius:8px;border:1px solid var(--card-border);
  background:var(--bg);font-family:var(--font);font-size:12px;font-weight:500;
  color:var(--muted);cursor:pointer;transition:all .15s;
}
.filter-btn.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.filter-btn:hover:not(.on){border-color:var(--text);color:var(--text)}
.filter-result{font-size:12px;color:var(--muted);margin-left:auto}

/* CONTENT */
.content{padding:24px}

/* HUB SECTION */
.hub-section{margin-bottom:20px}
.hub-section-hdr{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--border-r) var(--border-r) 0 0;
  padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;
}
.hub-section-hdr:hover{background:#fafafe}
.hub-rank{
  width:24px;height:24px;border-radius:50%;background:var(--indigo);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;
}
.hub-name{font-size:14px;font-weight:600;color:var(--text)}
.hub-tagline{font-size:12px;color:var(--muted);margin-top:1px}
.hub-badges{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.hub-revenue{font-size:12px;font-weight:600;color:var(--green);background:var(--green-lt);padding:3px 9px;border-radius:20px}
.hub-count{font-size:12px;color:var(--muted);font-weight:500}
.hub-chevron{color:var(--muted2);transition:transform .2s;margin-left:8px}
.hub-chevron.open{transform:rotate(180deg)}

.hub-metrics{
  background:#fafafe;border-left:1px solid var(--card-border);border-right:1px solid var(--card-border);
  padding:9px 18px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--card-border);
}

/* TABLE */
.prog-table-wrap{
  border:1px solid var(--card-border);border-top:none;border-radius:0 0 var(--border-r) var(--border-r);
  overflow:hidden;background:var(--card-bg);
}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--bg)}
thead th{
  padding:9px 14px;font-size:11px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;text-align:left;
  border-bottom:1px solid var(--card-border);white-space:nowrap;cursor:pointer;
}
thead th:hover{color:var(--text)}
thead th.sort-asc::after{content:' ↑'}
thead th.sort-desc::after{content:' ↓'}
tbody tr{border-bottom:1px solid var(--card-border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#fafafe}
tbody tr.t1{border-left:3px solid var(--indigo)}
tbody tr.t2{border-left:3px solid var(--amber)}
tbody tr.t3{border-left:3px solid var(--muted2)}
tbody tr.t4{border-left:3px solid transparent}
td{padding:9px 14px;font-size:12.5px;vertical-align:middle}
td.st{font-weight:700;color:var(--muted);font-size:11.5px;width:36px}
td.school{font-weight:500;max-width:260px}
td.note-td{color:var(--text2);font-size:12px;max-width:320px;line-height:1.4}
td.note-td.empty{color:var(--muted2)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.b-cont{background:var(--green-lt);color:#1b5e20}
.b-prov{background:var(--amber-lt);color:var(--amber)}
.b-prob{background:var(--red-lt);color:var(--red)}
.b-pre{background:var(--blue-lt);color:var(--blue)}
.b-intro{background:var(--indigo-lt);color:var(--indigo);margin-left:6px;font-weight:600}
.b-client{background:var(--green-lt);color:#1b5e20;margin-left:4px;font-weight:600}
.b-tier{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:700}
.bt1{background:var(--indigo);color:#fff}
.bt2{background:var(--amber-lt);color:var(--amber)}
.bt3{background:var(--bg);color:var(--muted);border:1px solid var(--card-border)}

/* REVIEW URGENCY */
.rev-urgent{color:var(--red);font-weight:600}
.rev-soon{color:var(--amber);font-weight:500}

/* HUB STATUS DOT COLORS */
.dot-building{background:#4b5ce4}
.dot-established{background:#27ae60}
.dot-active{background:#f59e0b}
.dot-developing{background:#8a8fa8}
.dot-limited{background:#d1d5db}

/* EMPTY */
.empty-msg{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-msg h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}

/* COLLAPSED */
.hub-body{display:block}
.hub-body.collapsed{display:none}
</style>
</head>

const HUB_MAP = {};
HUBS.forEach(h => { h.states.forEach(s => HUB_MAP[s] = h.id); });

function reviewUrgency(rev) {
  if (!rev || rev === 'TBD' || rev === 'N/A') return 'none';
  const parts = rev.split('/');
  const yr = parseInt(parts[0]);
  const mo = parseInt(parts[1] || 1);
  const d = new Date(yr, mo - 1, 1);
  const now = new Date(2026, 9, 12);
  const months = (d - now) / (1000 * 60 * 60 * 24 * 30);
  if (months < 3) return 'urgent';
  if (months < 9) return 'soon';
  return 'ok';
}

function statusBadge(s) {
  if (s.includes('Probation')) return '<span class="badge b-prob">Probation</span>';
  if (s.includes('Provisional')) return '<span class="badge b-prov">Provisional</span>';
  if (s === 'Pre-Accreditation') return '<span class="badge b-pre">Pre-Accreditation</span>';
  if (s.includes('Continued')) return '<span class="badge b-cont">Continued</span>';
  return '<span class="badge" style="background:var(--bg);color:var(--muted)">' + (s || '—') + '</span>';
}

function tierBadge(t) {
  if (t === 1) return '<span class="b-tier bt1">T1</span>';
  if (t === 2) return '<span class="b-tier bt2">T2</span>';
  if (t === 3) return '<span class="b-tier bt3">T3</span>';
  return '';
}

let activeFilters = { status: 'all', state: 'all', search: '', view: 'all' };

function matchFilter(r) {
  const { status, state, search, view } = activeFilters;
  if (view === 'noted' && !r.note) return false;
  if (view === 'hot' && r.tier > 2) return false;
  if (status === 'probation' && !r.status.includes('Probation')) return false;
  if (status === 'provisional' && !r.status.includes('Provisional')) return false;
  if (status === 'continued' && !r.status.includes('Continued')) return false;
  if (status === 'preaccred' && r.status !== 'Pre-Accreditation') return false;
  if (state !== 'all' && r.state !== state) return false;
  if (search && !r.school.toLowerCase().includes(search.toLowerCase())) return false;
  return true;
}

function hubDotClass(status) {
  return 'dot-' + status;
}

function renderAll() {
  const ca = document.getElementById('content-area');
  const count = document.getElementById('f-count');
  const hs = document.getElementById('hs-showing');
  let total = 0;
  let html = '';

  HUBS.forEach((hub, idx) => {
    const progs = PROGRAMS.filter(p => p.hubId === hub.id && matchFilter(p));
    if (progs.length === 0) return;
    total += progs.length;

    // Sort: tier asc, then probation, then school
    progs.sort((a, b) => {
      if (a.tier !== b.tier) return a.tier - b.tier;
      return a.school.localeCompare(b.school);
    });

    const revenueHtml = hub.revenue
      ? `<span class="hub-revenue">${hub.revenue}</span>`
      : `<span class="badge" style="background:var(--bg);color:var(--muted);font-size:11px;padding:3px 9px">${hub.status_label}</span>`;

    const rows = progs.map(p => {
      const urg = reviewUrgency(p.nextReview);
      const revCls = urg === 'urgent' ? ' class="rev-urgent"' : urg === 'soon' ? ' class="rev-soon"' : '';
      const intro = p.introAvail ? '<span class="badge b-intro">Intro avail</span>' : '';
      const client = p.existingClient ? '<span class="badge b-client">Existing client</span>' : '';
      const noteCls = p.note ? '' : ' empty';
      return `<tr class="t${p.tier}">
        <td>${tierBadge(p.tier)}</td>
        <td class="st">${p.state}</td>
        <td class="school">${p.school}${intro}${client}</td>
        <td>${statusBadge(p.status)}</td>
        <td${revCls}>${p.nextReview || '—'}</td>
        <td class="note-td${noteCls}">${p.note || '—'}</td>
      </tr>`;
    }).join('');

    html += `<div class="hub-section" id="hub-${hub.id}">
      <div class="hub-section-hdr" onclick="toggleHub('${hub.id}')">
        <div class="hub-rank">${idx + 1}</div>
        <div>
          <div class="hub-name">${hub.name}</div>
          <div class="hub-tagline">${hub.tagline}</div>
        </div>
        <div class="hub-badges">
          ${revenueHtml}
          <span class="hub-count">${progs.length} program${progs.length !== 1 ? 's' : ''}</span>
          <svg class="hub-chevron open" id="chev-${hub.id}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
        </div>
      </div>
      <div class="hub-metrics">${hub.metrics} &nbsp;·&nbsp; States: ${hub.states_display}</div>
      <div class="hub-body" id="body-${hub.id}">
        <div class="prog-table-wrap">
          <table>
            <thead><tr>
              <th style="width:40px">Tier</th>
              <th style="width:36px">St.</th>
              <th>School</th>
              <th style="width:130px">ARC-PA Status</th>
              <th style="width:110px">Next Review</th>
              <th>Intel / Notes</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  });

  if (!html) {
    ca.innerHTML = '<div class="empty-msg"><h3>No programs match</h3><p>Try adjusting your filters.</p></div>';
  } else {
    ca.innerHTML = html;
  }

  count.textContent = `${total} programs`;
  hs.textContent = total;
}

function toggleHub(id) {
  const body = document.getElementById('body-' + id);
  const chev = document.getElementById('chev-' + id);
  const collapsed = body.classList.toggle('collapsed');
  chev.classList.toggle('open', !collapsed);
}

// Build sidebar hub nav
function buildHubNav() {
  const nav = document.getElementById('hub-nav');
  nav.innerHTML = HUBS.map(h => {
    const count = PROGRAMS.filter(p => p.hubId === h.id).length;
    return `<button class="hub-nav-item" onclick="scrollToHub('${h.id}')" title="${h.states_display}">
      <span class="hub-nav-dot ${hubDotClass(h.status)}"></span>
      ${h.name}
      <span class="hub-nav-count">${count}</span>
    </button>`;
  }).join('');
}

function scrollToHub(id) {
  const el = document.getElementById('hub-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// View filter buttons (sidebar)
document.querySelectorAll('[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilters.view = btn.dataset.view;
    renderAll();
  });
});

document.getElementById('f-status').addEventListener('change', e => { activeFilters.status = e.target.value; renderAll(); });
document.getElementById('f-state').addEventListener('change', e => { activeFilters.state = e.target.value; renderAll(); });

let st;
document.getElementById('f-search').addEventListener('input', e => {
  clearTimeout(st);
  st = setTimeout(() => { activeFilters.search = e.target.value; renderAll(); }, 200);
});

buildHubNav();
renderAll();
</script>
